# A new user creates a household (H-02.1, H-02.2): name, then household name and region, who
# they're feeding (a toddler), allergies, then the Plan tab in at most 4 screens. Resumes after
# a restart at the same step with its answers (FR-ONB-7). Ends signed out.
# Needs the local stack; see the Testing section of README.md.
appId: ${APP_ID || 'com.myparentmanager'}
tags:
  - backend
---
- runFlow: subflows/sign-up-with-email.yaml
- extendedWaitUntil:
    visible:
      id: welcome-name
    timeout: 20000
- tapOn:
    id: welcome-name
- inputText: Sam
- hideKeyboard
- tapOn:
    id: welcome-create
- extendedWaitUntil:
    visible:
      id: create-household-screen-title
    timeout: 10000
- tapOn:
    id: region-GB
# Kill and reopen the app: onboarding resumes at this step with the answer kept.
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: create-household-screen-title
    timeout: 30000
- assertVisible:
    id: region-GB
    checked: true
# Continue sits below the region options on small screens.
- scrollUntilVisible:
    element:
      id: create-household-continue
- tapOn:
    id: create-household-continue
# S-07: "Expecting, or how old is your youngest?"
- extendedWaitUntil:
    visible:
      id: people-screen-title
    timeout: 10000
- scrollUntilVisible:
    element:
      id: add-child-toddler
- tapOn:
    id: add-child-toddler
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: people-screen-title
    timeout: 30000
- scrollUntilVisible:
    element:
      id: child-0-band-toddler
- assertVisible:
    id: child-0-band-toddler
    checked: true
- scrollUntilVisible:
    element:
      id: people-continue
- tapOn:
    id: people-continue
# S-08: allergies with the disclaimer.
- extendedWaitUntil:
    visible:
      id: allergies-screen-title
    timeout: 10000
- assertVisible:
    id: allergy-disclaimer
- scrollUntilVisible:
    element:
      id: dietary-1-allergen.peanut
- tapOn:
    id: dietary-1-allergen.peanut
- scrollUntilVisible:
    element:
      id: allergies-finish
- tapOn:
    id: allergies-finish
- extendedWaitUntil:
    visible:
      id: plan-screen-title
    timeout: 20000
- tapOn:
    id: tab-household
- scrollUntilVisible:
    element:
      id: sign-out
- tapOn:
    id: sign-out
- extendedWaitUntil:
    visible:
      id: sign-in-screen-title
    timeout: 10000
