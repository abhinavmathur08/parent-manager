# Shared steps: a new account names itself and creates a household with the default name
# and region, skips the people and allergies steps, and ends on the Plan tab. Not run on its own (config.yaml runs top-level flows only).
appId: ${APP_ID || 'com.myparentmanager'}
---
- runFlow: sign-up-with-email.yaml
- extendedWaitUntil:
    visible:
      id: welcome-name
    timeout: 20000
- tapOn:
    id: welcome-name
- inputText: ${NAME || 'Sam'}
- hideKeyboard
- tapOn:
    id: welcome-create
- extendedWaitUntil:
    visible:
      id: create-household-screen-title
    timeout: 10000
- scrollUntilVisible:
    element:
      id: create-household-continue
- tapOn:
    id: create-household-continue
# Onboarding's people and allergies steps (H-02.2) come after the household details.
- scrollUntilVisible:
    element:
      id: people-skip
- tapOn:
    id: people-skip
- scrollUntilVisible:
    element:
      id: allergies-skip
- tapOn:
    id: allergies-skip
- extendedWaitUntil:
    visible:
      id: plan-screen-title
    timeout: 20000
