# Waits for the vault lock to be passed (the system prompt, matched on the device or in the
# Simulator), then checks the empty vault (S-40) and the add screen (S-41): Save waits for a
# file, a title and a category. Picking a file or scanning needs the system's own screens, so
# storing a document is covered by unit tests and the documents function's tests.
appId: ${APP_ID || 'com.myparentmanager'}
---
- extendedWaitUntil:
    visible:
      id: vault-screen
    timeout: 60000
- assertVisible:
    id: vault-empty
- tapOn:
    id: vault-add
- extendedWaitUntil:
    visible:
      id: add-document
    timeout: 10000
- assertVisible:
    id: add-file
- tapOn:
    id: add-title
- inputText: Insurance card
- hideKeyboard
- tapOn:
    id: add-category-doc.insurance
- assertVisible:
    id: add-save
    enabled: false
- tapOn:
    id: add-document-title-back
- extendedWaitUntil:
    visible:
      id: vault-empty
    timeout: 10000
- tapOn:
    id: vault-screen-title-back
- extendedWaitUntil:
    visible:
      id: household-screen
    timeout: 10000
