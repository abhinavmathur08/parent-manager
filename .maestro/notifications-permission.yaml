# N-01.1 (FR-NOT-2, FR-ONB-8): push permission is asked in context. Onboarding never asks;
# the first planned week (5 dinners, FR-PLAN-12) offers notifications in a sheet, and
# "Not now" leaves them off without the system prompt. Notification settings then show the
# push status. Ends signed out. Needs the local stack; see the Testing section of README.md.
appId: ${APP_ID || 'com.myparentmanager'}
tags:
  - backend
---
- runFlow: subflows/create-household.yaml
# Onboarding is over and nothing asked for permission.
- assertNotVisible:
    id: push-prompt-body
# Maestro grants every permission at launch; take notifications back so the app can ask.
- launchApp:
    permissions:
      notifications: unset
- extendedWaitUntil:
    visible:
      id: plan-days
    timeout: 20000

# Day 1 from the starter library, then the recent recipe up to 5 dinners.
- scrollUntilVisible:
    element:
      id: plan-empty
    direction: UP
- scrollUntilVisible:
    element:
      id: plan-add-0-dinner
    centerElement: true
- tapOn:
    id: plan-add-0-dinner
- extendedWaitUntil:
    visible:
      id: add-search
    timeout: 10000
- tapOn:
    id: add-search
- inputText: lentil
- hideKeyboard
- scrollUntilVisible:
    element:
      id: add-starter-0
- tapOn:
    id: add-starter-0
- extendedWaitUntil:
    notVisible:
      id: add-search
    timeout: 10000
- scrollUntilVisible:
    element:
      id: plan-range
    direction: UP
- runFlow:
    file: subflows/plan-recent-dinner.yaml
    env:
      DAY: '1'
- runFlow:
    file: subflows/plan-recent-dinner.yaml
    env:
      DAY: '2'
- runFlow:
    file: subflows/plan-recent-dinner.yaml
    env:
      DAY: '3'
- assertNotVisible:
    id: push-prompt-body
- runFlow:
    file: subflows/plan-recent-dinner.yaml
    env:
      DAY: '4'

# The fifth dinner plans the week: the sheet explains before anything asks the system.
- extendedWaitUntil:
    visible:
      id: push-prompt-body
    timeout: 10000
- tapOn:
    id: push-prompt-not-now
- extendedWaitUntil:
    notVisible:
      id: push-prompt-body
    timeout: 10000

# Notification settings show the push status, with a way to turn push on.
- tapOn:
    id: tab-household
- scrollUntilVisible:
    element:
      id: open-notifications
- tapOn:
    id: open-notifications
- extendedWaitUntil:
    visible:
      id: push-status
    timeout: 10000
- tapOn:
    id: notifications-screen-title-back

- runFlow: subflows/sign-out.yaml
