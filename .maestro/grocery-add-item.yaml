# G-02.2 and G-02.3 (FR-LIST-2, FR-LIST-6, FR-LIST-7, R-LIST-6): opening the List tab creates
# the week's list; a member types "diap", picks the diapers suggestion and finds it under its
# store section, adds free text as typed, renames it in item detail and deletes the diapers.
# Ends signed out. Needs the local stack; see README.md.
appId: ${APP_ID || 'com.myparentmanager'}
tags:
  - backend
---
- runFlow: subflows/create-household.yaml

# Nothing planned yet: the empty list offers "add an item" once the week's list exists.
- tapOn:
    id: tab-list
- extendedWaitUntil:
    visible:
      id: list-empty-add
    timeout: 15000
- tapOn:
    id: list-empty-add
- extendedWaitUntil:
    visible:
      id: add-item-search
    timeout: 10000
- tapOn:
    id: add-item-search
- inputText: diap
- hideKeyboard
- tapOn:
    id: add-item-suggestion-0
- assertVisible:
    id: add-item-chosen
    text: .*diaper.*
- tapOn:
    id: add-item-done
- extendedWaitUntil:
    visible:
      id: list-section-baby
    timeout: 10000
- assertVisible:
    id: list-item-baby-0
    text: .*diaper.*

# Free text stays its own row, in the section the member picks.
- tapOn:
    id: list-add
- extendedWaitUntil:
    visible:
      id: add-item-search
    timeout: 10000
- tapOn:
    id: add-item-search
- inputText: Birthday card
- hideKeyboard
- tapOn:
    id: add-item-as-typed
- scrollUntilVisible:
    element:
      id: add-item-section-household
    centerElement: true
- tapOn:
    id: add-item-section-household
- tapOn:
    id: add-item-done
- scrollUntilVisible:
    element:
      id: list-section-household
- assertVisible:
    id: list-item-household-0
    text: .*Birthday card.*

# G-02.3 (FR-LIST-7): item detail renames an item, and delete takes it off after the undo bar.
- tapOn:
    id: list-item-household-0-details
- extendedWaitUntil:
    visible:
      id: item-name
    timeout: 10000
- tapOn:
    id: item-name
- eraseText: 30
- inputText: Card for Grandma
- hideKeyboard
# The sources sit under the amount and unit chips, below the fold on smaller screens.
- scrollUntilVisible:
    element:
      id: item-no-sources
    centerElement: true
- assertVisible:
    id: item-no-sources
    text: .*by hand.*
- tapOn:
    id: item-save
- extendedWaitUntil:
    visible:
      id: list-item-household-0
      text: .*Card for Grandma.*
    timeout: 10000
- scrollUntilVisible:
    element:
      id: list-item-baby-0-details
    direction: UP
    centerElement: true
- tapOn:
    id: list-item-baby-0-details
# Wait for the top of the sheet; Delete is at the bottom of its scrolling body, below the fold
# on smaller screens.
- extendedWaitUntil:
    visible:
      id: item-name
    timeout: 10000
- scrollUntilVisible:
    element:
      id: item-delete
    centerElement: true
- tapOn:
    id: item-delete
- assertVisible:
    id: list-undo
- assertNotVisible:
    id: list-section-baby

- runFlow: subflows/sign-out.yaml
