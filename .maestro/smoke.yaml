# Runs against a release build, which bundles its JS and needs no Metro server.
# See the "Testing" section of README.md. Production's app ID by default; for another
# variant pass its ID, for example `maestro test -e APP_ID=com.myparentmanager.dev .maestro`.
# (A flow-level `env:` default would win over -e, so the default lives in the expression.)
appId: ${APP_ID || 'com.myparentmanager'}
---
- launchApp:
    clearState: true
# The app opens on the Plan tab, under the floating tab bar.
- extendedWaitUntil:
    visible:
      id: plan-screen-title
    timeout: 60000
- assertVisible:
    id: tab-bar
- tapOn:
    id: tab-list
- assertVisible:
    id: list-screen-title
- tapOn:
    id: tab-recipes
- assertVisible:
    id: recipes-screen-title
- tapOn:
    id: tab-household
- assertVisible:
    id: household-screen-title
- assertVisible:
    id: supabase-status
- tapOn:
    id: tab-plan
- assertVisible:
    id: plan-screen-title
