# Signs up with an email code, lands on onboarding (no household yet), and signs out
# (A-01.2). Needs the local stack; see the Testing section of README.md.
appId: ${APP_ID || 'com.myparentmanager'}
tags:
  - backend
---
- runFlow: subflows/sign-up-with-email.yaml
- extendedWaitUntil:
    visible:
      id: welcome-screen-title
    timeout: 20000
- assertNotVisible:
    id: tab-bar
- tapOn:
    id: welcome-sign-out
- extendedWaitUntil:
    visible:
      id: sign-in-screen-title
    timeout: 10000
