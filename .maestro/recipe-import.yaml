# R-06.1, S-19 and S-20: a parent opens import from the Recipes tab, sees the month's
# allowance, pastes a recipe's text, waits on the progress screen and reaches review (S-21).
# The local stack parses with the fake AI provider: supabase/functions/.env needs
# AI_PROVIDER=fake (see the Testing section of README.md). Ends signed out.
appId: ${APP_ID || 'com.myparentmanager'}
tags:
  - backend
---
- runFlow: subflows/create-household.yaml
- tapOn:
    id: tab-recipes
- tapOn:
    id: recipes-import-action
- extendedWaitUntil:
    visible:
      id: import-screen
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: import-allowance
    timeout: 20000
- scrollUntilVisible:
    element:
      id: import-text-input
    centerElement: true
- tapOn:
    id: import-text-input
- inputText: "Lemon chicken\nServes 4\nIngredients\n4 chicken thighs\n2 tbsp olive oil\n1 lemon, juiced\nMethod\nRoast for 40 minutes."
- hideKeyboard
- scrollUntilVisible:
    element:
      id: import-text-submit
    centerElement: true
- tapOn:
    id: import-text-submit
# The first request to a cold Edge Function worker can take a while.
- extendedWaitUntil:
    visible:
      id: import-review
    timeout: 90000
- runFlow: subflows/sign-out.yaml
