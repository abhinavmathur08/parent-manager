# R-06.1 and R-06.2, S-19 to S-21: a parent imports a recipe from a link with the mocked AI
# model, sees the month's allowance and the progress screen, checks the draft on review
# (lines show the source's text), saves it, and finds it on the recipe detail screen.
# The local stack parses with the fake AI provider and serves `.test` links itself:
# supabase/functions/.env needs AI_PROVIDER=fake (see the Testing section of README.md).
# Ends signed out.
appId: ${APP_ID || 'com.myparentmanager'}
tags:
  - backend
---
- runFlow: subflows/create-household.yaml
- tapOn:
    id: tab-recipes
- tapOn:
    id: recipes-import-action
- extendedWaitUntil:
    visible:
      id: import-screen
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: import-allowance
    timeout: 20000
- tapOn:
    id: import-link-input
- inputText: https://recipes.example.test/lemon-chicken
- hideKeyboard
- tapOn:
    id: import-link-submit
# The first request to a cold Edge Function worker can take a while.
- extendedWaitUntil:
    visible:
      id: import-review-intro
    timeout: 90000
# Each line shows the source's original text (FR-AI-5), below the title and times.
- scrollUntilVisible:
    element:
      id: import-line-original-0
    centerElement: true
- scrollUntilVisible:
    element:
      id: recipe-save
    centerElement: true
- tapOn:
    id: recipe-save
- extendedWaitUntil:
    visible:
      id: recipe-detail
    timeout: 10000
- assertVisible:
    text: Lemon chicken traybake
# FR-AI-15: an imported recipe shows where it came from.
- scrollUntilVisible:
    element:
      id: recipe-detail-source
    centerElement: true
- runFlow: subflows/sign-out.yaml
