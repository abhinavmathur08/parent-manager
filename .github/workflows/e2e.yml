# Builds release apps and runs the Maestro flows on Android emulators (x86_64 APK, in four
# shards) and an iOS simulator (F-04.3). Slow (20+ minutes), so it isn't run on every PR:
# start it from the Actions tab or with `gh workflow run e2e.yml --ref <branch>`.
# It also runs after merges to main.
name: E2E

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MAESTRO_VERSION: 2.12.1

jobs:
  # Android builds one release APK, then runs the flows in shards, each on its own emulator
  # with its own local stack, so the whole run stays well inside the time limits (#216).
  android-build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      publishable-key: ${{ steps.stack.outputs.key }}
    steps:
      # The native build doesn't fit on a stock runner's disk.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version comes from packageManager in package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - run: pnpm install --frozen-lockfile
      # The build needs the local stack's publishable key, which is public and the same on
      # every fresh local stack. Each shard checks that its own stack has the same key.
      - name: Read the local stack's publishable key
        id: stack
        run: |
          pnpm supabase start -x realtime,storage-api,imgproxy,postgres-meta,studio,logflare,vector,supavisor,edge-runtime
          key="$(pnpm --silent supabase status -o json | jq -r '.PUBLISHABLE_KEY // .ANON_KEY // empty')"
          if [ -z "${key}" ]; then
            echo "::error::No publishable key in the output of supabase status."
            exit 1
          fi
          echo "key=${key}" >> "$GITHUB_OUTPUT"
          echo "EXPO_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${key}" >> "$GITHUB_ENV"
          # The mock store, allowed only because this build sets E2E_LOCAL_BACKEND=1 (app.config.ts).
          echo "EXPO_PUBLIC_BILLING_PROVIDER=mock" >> "$GITHUB_ENV"
          pnpm supabase stop --no-backup
      - name: Generate the native Android project
        env:
          E2E_LOCAL_BACKEND: '1' # allows plain HTTP to the local stack; see app.config.ts
        run: pnpm expo prebuild --platform android --no-install
      - name: Build release APK
        working-directory: android
        env:
          E2E_LOCAL_BACKEND: '1'
        run: ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 3

  android-flows:
    name: Maestro on Android (${{ matrix.shard }}/4)
    needs: android-build
    runs-on: ubuntu-latest
    # Setup takes about 10 minutes and each shard's flows about 20.
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version comes from packageManager in package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v6 # Maestro runs on the JVM
        with:
          distribution: temurin
          java-version: '17'
      - run: pnpm install --frozen-lockfile
      # The sign-in flow needs a backend: the local stack, with Mailpit as the test inbox.
      # The app reaches it on 127.0.0.1 through `adb reverse`, and Maestro reads Mailpit.
      - name: Start local Supabase
        env:
          BUILT_KEY: ${{ needs.android-build.outputs.publishable-key }}
        run: |
          # The mock billing store (M-01.2) runs only where BILLING_MOCK_ENABLED is set, and the
          # fake AI parser (R-05.3) only where AI_PROVIDER=fake is set on a local stack. This is
          # the throwaway local stack; the file is git-ignored and never deployed.
          printf 'BILLING_MOCK_ENABLED=true\nAI_PROVIDER=fake\n' > supabase/functions/.env
          services=realtime,storage-api,imgproxy,postgres-meta,studio,logflare,vector,supavisor
          # A runner sometimes still holds a port ("address already in use"); retry once.
          pnpm supabase start -x "${services}" || {
            echo "::warning::supabase start failed; stopping and retrying once."
            pnpm supabase stop --no-backup || true
            sleep 10
            pnpm supabase start -x "${services}"
          }
          key="$(pnpm --silent supabase status -o json | jq -r '.PUBLISHABLE_KEY // .ANON_KEY // empty')"
          if [ "${key}" != "${BUILT_KEY}" ]; then
            echo "::error::This stack's publishable key differs from the one the APK was built with."
            exit 1
          fi
          echo "EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${key}" >> "$GITHUB_ENV"
      - name: Warm up the Edge Functions
        # A cold worker takes a while to boot; the Premium flows shouldn't spend their waits on
        # it. The anon JWT gets past the gateway, so the function itself answers (with its own
        # 401) once it has booted.
        run: |
          anon="$(pnpm --silent supabase status -o json | jq -r '.ANON_KEY // empty')"
          for attempt in 1 2 3 4 5 6; do
            body="$(curl -s -m 60 -X POST http://127.0.0.1:54321/functions/v1/mock-store \
              -H "apikey: ${EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY}" -H "Authorization: Bearer ${anon}" \
              -d '{"action":"status"}' || true)"
            echo "attempt ${attempt}: ${body}"
            case "${body}" in *billing.*) exit 0 ;; esac
            sleep 10
          done
          echo "::warning::The mock-store function didn't answer during warm-up."
      - uses: actions/download-artifact@v8
        with:
          name: android-apk
      # Every flow file except config.yaml, dealt out in turn so the long Premium flows spread
      # across the shards. Each flow signs up its own user, so shards share nothing.
      - name: Pick this shard's flows
        run: |
          flows="$(ls .maestro/*.yaml | grep -v '/config\.yaml$' | sort \
            | awk -v n=4 -v i=${{ matrix.shard }} '(NR - 1) % n == i - 1' | tr '\n' ' ')"
          echo "Flows: ${flows}"
          echo "FLOWS=${flows}" >> "$GITHUB_ENV"
      - name: Install Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # A booted emulator snapshot, so each shard skips the cold boot.
      - name: Restore the emulator snapshot
        id: avd-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-google_apis-x86_64-pixel_6
      - name: Create the emulator snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          # A current phone size, like the iPhone the iOS job uses. The runner's default
          # device is 320 x 640 dp, where the floating tab bar covers rows the flows tap.
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Created the emulator snapshot."
      - name: Run Maestro flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install app-release.apk
            adb reverse tcp:54321 tcp:54321
            maestro test --format junit --output maestro-report.xml ${FLOWS}
      - name: Upload Maestro report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-report-android-${{ matrix.shard }}
          path: |
            maestro-report.xml
            ~/.maestro/tests
          if-no-files-found: ignore

  # One check that passes only when the build and every shard pass, so branch protection can
  # require a single name however the flows are split.
  android:
    name: Maestro on Android
    if: always()
    needs: [android-build, android-flows]
    runs-on: ubuntu-latest
    steps:
      - name: Check the build and every shard
        run: |
          echo "build: ${{ needs.android-build.result }}, flows: ${{ needs.android-flows.result }}"
          [ "${{ needs.android-build.result }}" = success ] && [ "${{ needs.android-flows.result }}" = success ]

  ios:
    name: Maestro on iOS
    # macOS runners are free for public repos. Expo SDK 58 needs Xcode 26.4 or later,
    # which needs macOS Tahoe 26.2 or later.
    runs-on: macos-26
    timeout-minutes: 90
    env:
      LANG: en_US.UTF-8 # CocoaPods fails without a UTF-8 locale
    steps:
      - uses: actions/checkout@v7
      - name: Select the newest Xcode (26.4 or later)
        run: |
          xcode="$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)"
          sudo xcode-select -s "${xcode}"
          version="$(xcodebuild -version | awk 'NR==1 { print $2 }')"
          echo "Using ${xcode} (Xcode ${version})"
          if [ "$(printf '%s\n' 26.4 "${version}" | sort -V | head -n 1)" != "26.4" ]; then
            echo "::error::Expo SDK 58 needs Xcode 26.4 or later, but the newest on this runner is ${version}."
            exit 1
          fi
      - uses: pnpm/action-setup@v6 # version comes from packageManager in package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v6 # Maestro runs on the JVM
        with:
          distribution: temurin
          java-version: '17'
      - run: pnpm install --frozen-lockfile
      # No APP_VARIANT, so this is the production variant (com.myparentmanager), the
      # flows' default app ID.
      - name: Generate the native iOS project and install pods
        run: pnpm expo prebuild --platform ios
      - name: Boot a simulator
        id: simulator
        run: |
          udid="$(xcrun simctl list devices available --json | python3 -c '
          import json, re, sys
          runtimes = json.load(sys.stdin)["devices"]
          versions = {}
          for runtime in runtimes:
              match = re.search(r"SimRuntime\.iOS-(\d+)-(\d+)$", runtime)
              if match:
                  versions[runtime] = (int(match[1]), int(match[2]))
          for runtime in sorted(versions, key=versions.get, reverse=True):
              # Prefer a standard model ("iPhone 17 Pro") over unusual ones.
              phones = [d for d in runtimes[runtime] if re.match(r"iPhone \d+", d["name"])]
              if phones:
                  print(phones[-1]["udid"])
                  break
          ')"
          if [ -z "${udid}" ]; then
            echo "::error::No iPhone simulator is available on this runner."
            exit 1
          fi
          xcrun simctl list devices | grep "${udid}"
          xcrun simctl boot "${udid}"
          echo "udid=${udid}" >> "$GITHUB_OUTPUT"
      - name: Build a release app for the simulator
        run: |
          workspace="$(ls -d ios/*.xcworkspace | head -n 1)"
          scheme="$(basename "${workspace}" .xcworkspace)"
          # The full log is long, so keep it as an artifact and print its tail on failure.
          xcodebuild \
            -workspace "${workspace}" \
            -scheme "${scheme}" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build > xcodebuild.log 2>&1 || { tail -n 200 xcodebuild.log; exit 1; }
          tail -n 5 xcodebuild.log
      - name: Install the app
        run: xcrun simctl install "${{ steps.simulator.outputs.udid }}" build/Build/Products/Release-iphonesimulator/*.app
      - name: Install Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Run Maestro flows
        # macOS runners have no Docker for the local stack, so flows that need a backend
        # (tagged `backend`) run on Android only.
        run: maestro --device "${{ steps.simulator.outputs.udid }}" test --exclude-tags backend --format junit --output maestro-report.xml .maestro
      - name: Upload Maestro report and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-report-ios
          path: |
            maestro-report.xml
            ~/.maestro/tests
            xcodebuild.log
          if-no-files-found: ignore
