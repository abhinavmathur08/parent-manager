# Same checks as `pnpm run check`, plus a check that dependencies match the Expo SDK.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version comes from packageManager in package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check Expo dependency versions
        run: pnpm expo install --check
      - run: pnpm run lint
      - run: pnpm run lint:rules
      - run: pnpm run format:check
      - run: pnpm run typecheck
      - run: pnpm run test:ci

  database:
    name: Database tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version comes from packageManager in package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Only Postgres and Auth are needed: Auth's migrations create auth.users, which the
      # tests sign in as. Skipping the rest keeps the job well under its 10-minute limit.
      - name: Start local Supabase and apply migrations
        run: pnpm supabase start -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Run pgTAP tests
        run: pnpm run test:db
