# Same checks as `npm run check`, plus a check that dependencies match the Expo SDK.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check Expo dependency versions
        run: npx expo install --check
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:ci
