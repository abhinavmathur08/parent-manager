# Same checks as `pnpm run check`, plus a check that dependencies match the Expo SDK.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version comes from packageManager in package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check Expo dependency versions
        run: pnpm expo install --check
      - run: pnpm run lint
      - run: pnpm run lint:rules
      - run: pnpm run format:check
      - run: pnpm run typecheck
      - run: pnpm run test:ci
